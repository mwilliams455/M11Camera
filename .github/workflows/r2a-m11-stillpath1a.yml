name: R2A M11 still path 1A
on:
  workflow_dispatch:
  push:
    branches: [work/mcc-stillpath1a-20260920]
    paths:
      - 'tools/trace_m11_stillpath1a.py'
      - 'tests/test_stillpath1a.py'
      - '.github/workflows/r2a-m11-stillpath1a.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet capstone==5.0.6 PyYAML==6.0.2
      - name: Test A32 branch and string decoders
        run: |
          python -m py_compile tools/trace_m11_stillpath1a.py
          python -m unittest discover -s tests -p test_stillpath1a.py -v
      - name: Acquire canonical firmware from pinned recipe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin aab01bda048cd55756a516e1abc2cf2728da6abf
          git show aab01bda048cd55756a516e1abc2cf2728da6abf:.github/workflows/r2a-m11-mcc-078c-xrefs.yml > /tmp/acquire.yml
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('/tmp/acquire.yml').read_text())['jobs']['trace']['steps']
          for name in ('Acquire exact updater','Decompress and verify'):
              match=[s['run'] for s in steps if s.get('name')==name]
              if len(match)!=1: raise RuntimeError('recipe anchor mismatch: '+name)
              subprocess.run(['bash','-euo','pipefail','-c',match[0]],check=True)
          PY
      - name: Trace bounded still-IQ paths and export byte evidence
        run: |
          python tools/trace_m11_stillpath1a.py /tmp/M11P.bin --output-dir /tmp/stillpath1a
          cp tools/trace_m11_stillpath1a.py tests/test_stillpath1a.py /tmp/stillpath1a/
          git rev-parse HEAD > /tmp/stillpath1a/revision.txt
          git diff --stat c7e0e36d8560c76813ef41be0d257ba13a1c6502 HEAD > /tmp/stillpath1a/research_changes.txt
      - name: Include decoder wheel for offline evidence checks
        run: python -m pip download --quiet --no-deps --only-binary=:all: capstone==5.0.6 -d /tmp/stillpath1a/wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2a-m11-stillpath1a
          path: /tmp/stillpath1a/*
          retention-days: 14
      - if: always()
        run: rm -f /tmp/LEICA_M11-P_2.6.1.FW /tmp/M11P.bin
