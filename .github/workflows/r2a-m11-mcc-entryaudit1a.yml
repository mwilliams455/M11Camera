name: R2A M11 MCC entry audit 1A

on:
  workflow_dispatch:
  push:
    branches: [work/render1h-cat42yq3a-placement1a]
    paths:
      - 'tools/trace_m11_mcc_entryaudit1a.py'
      - '.github/workflows/r2a-m11-mcc-entryaudit1a.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet capstone==5.0.6 PyYAML==6.0.2
      - name: Compile and unit-check branch decoder
        run: |
          python -m py_compile tools/trace_m11_mcc_entryaudit1a.py
          PYTHONPATH=tools python - <<'PY'
          from trace_m11_mcc_entryaudit1a import arm_branch
          assert arm_branch(0x1000, 0xEB000002)['target'] == 0x1010
          assert arm_branch(0x1000, 0xEAFFFFFE)['target'] == 0x1000
          assert arm_branch(0x1000, 0xFA000002) is None
          assert arm_branch(0x1000, 0xE1A00000) is None
          print('4 ARM decoder tests passed')
          PY
      - name: Acquire and verify canonical firmware using frozen acquisition recipe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin aab01bda048cd55756a516e1abc2cf2728da6abf
          git show aab01bda048cd55756a516e1abc2cf2728da6abf:.github/workflows/r2a-m11-mcc-078c-xrefs.yml > /tmp/mcc-acquisition.yml
          python - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path
          recipe = yaml.safe_load(Path('/tmp/mcc-acquisition.yml').read_text())
          steps = recipe['jobs']['trace']['steps']
          for name in ('Acquire exact updater', 'Decompress and verify'):
              selected = [s['run'] for s in steps if s.get('name') == name]
              if len(selected) != 1:
                  raise RuntimeError('acquisition recipe anchor mismatch: ' + name)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', selected[0]], check=True)
          PY
      - name: Audit ordinal sequence and exact MCC entry boundary
        run: python tools/trace_m11_mcc_entryaudit1a.py /tmp/M11P.bin --output-dir /tmp/mcc-entryaudit1a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2a-m11-mcc-entryaudit1a
          path: /tmp/mcc-entryaudit1a/*
          retention-days: 14
      - if: always()
        run: rm -f /tmp/LEICA_M11-P_2.6.1.FW /tmp/M11P.bin
