name: R2A M11 gamma consumer trace

on:
  push:
    branches:
      - research/m11-r0-evidence-input-space
    paths:
      - 'tools/trace_m11_gamma_consumers.py'
      - 'tools/summarize_m11p_open_categories.py'
      - 'tools/decompress_m11.py'
      - 'tools/m11_romfs_probe.py'
      - '.github/workflows/r2a-m11-gamma-consumer-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Leica M11-P 2.6.1 firmware
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'
          referer='https://leica-camera.com/en-GB/photography/cameras/m/m11-p-black/downloads'
          urls=(
            'https://www.leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW'
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW?download=1'
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW'
          )
          rm -f /tmp/LEICA_M11-P_2.6.1.FW
          for url in "${urls[@]}"; do
            echo "Trying official Leica firmware endpoint: ${url%%\?*}"
            if curl --http1.1 -L --fail --retry 2 --retry-all-errors --retry-delay 2 \
              -A "$ua" -e "$referer" \
              -H 'Accept: application/octet-stream,*/*;q=0.8' \
              -o /tmp/LEICA_M11-P_2.6.1.FW "$url"; then
              if [ "$(stat -c%s /tmp/LEICA_M11-P_2.6.1.FW)" = "63621633" ]; then
                break
              fi
            fi
            rm -f /tmp/LEICA_M11-P_2.6.1.FW
          done
          test -f /tmp/LEICA_M11-P_2.6.1.FW
          test "$(stat -c%s /tmp/LEICA_M11-P_2.6.1.FW)" = "63621633"
          echo '0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83  /tmp/LEICA_M11-P_2.6.1.FW' | sha256sum -c -

      - name: Decompress and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/decompress_m11.py \
            /tmp/LEICA_M11-P_2.6.1.FW \
            -o /tmp/M11P_2.6.1_unpacked.bin
          test "$(stat -c%s /tmp/M11P_2.6.1_unpacked.bin)" = "97644400"
          echo '28528c24555f93ff69b6f6f4d47f8802719d47f5ddbe1d6dcad25d1840f35e3c  /tmp/M11P_2.6.1_unpacked.bin' | sha256sum -c -

      - name: Summarize open R2Y categories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          python tools/summarize_m11p_open_categories.py \
            /tmp/M11P_2.6.1_unpacked.bin \
            --json /tmp/r2a/open_categories.json \
            --markdown /tmp/r2a/open_categories.md
          cat /tmp/r2a/open_categories.md

      - name: Trace gamma strings to ROMFS consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          python tools/trace_m11_gamma_consumers.py \
            /tmp/M11P_2.6.1_unpacked.bin \
            --output /tmp/r2a/gamma_consumer_trace.md
          cat /tmp/r2a/gamma_consumer_trace.md

      - name: Upload derived R2A reports only
        uses: actions/upload-artifact@v4
        with:
          name: r2a-m11-gamma-consumer-trace
          path: |
            /tmp/r2a/gamma_consumer_trace.md
            /tmp/r2a/open_categories.json
            /tmp/r2a/open_categories.md
          if-no-files-found: error
          retention-days: 14
