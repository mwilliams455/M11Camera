name: R2A M11 gamma consumer trace

on:
  push:
    branches:
      - research/m11-r0-evidence-input-space
    paths:
      - 'tools/trace_m11_gamma_consumers.py'
      - 'tools/summarize_m11p_open_categories.py'
      - 'tools/decompress_m11.py'
      - 'tools/m11_romfs_probe.py'
      - '.github/workflows/r2a-m11-gamma-consumer-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download hash-gated Leica M11-P 2.6.1 firmware
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'
          leica_referer='https://leica-camera.com/en-GB/photography/cameras/m/m11-p-black/downloads'
          expected_size='63621633'
          expected_sha='0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83'

          try_url() {
            local url="$1"
            local referer="$2"
            echo "Trying firmware endpoint: ${url%%\?*}"
            rm -f /tmp/LEICA_M11-P_2.6.1.FW
            if ! curl --http1.1 -L --fail --retry 1 --retry-all-errors --retry-delay 1 \
              -A "$ua" -e "$referer" \
              -H 'Accept: application/octet-stream,*/*;q=0.8' \
              -o /tmp/LEICA_M11-P_2.6.1.FW "$url"; then
              return 1
            fi
            local size
            size="$(stat -c%s /tmp/LEICA_M11-P_2.6.1.FW)"
            echo "Downloaded bytes: $size"
            [ "$size" = "$expected_size" ] || return 1
            local actual_sha
            actual_sha="$(sha256sum /tmp/LEICA_M11-P_2.6.1.FW | awk '{print $1}')"
            echo "Downloaded SHA-256: $actual_sha"
            [ "$actual_sha" = "$expected_sha" ] || return 1
            return 0
          }

          verified=0
          for url in \
            'https://www.leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW' \
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW?download=1' \
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW'
          do
            if try_url "$url" "$leica_referer"; then
              verified=1
              break
            fi
          done

          if [ "$verified" = 0 ]; then
            tld_popup='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
            echo "Resolving public TLD mirror from: $tld_popup"
            curl --http1.1 -L --fail -A "$ua" \
              -o /tmp/tld_download.html "$tld_popup"
            python - <<'PY' >/tmp/tld_urls.txt
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin
          import re

          base = 'https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
          text = Path('/tmp/tld_download.html').read_text(errors='replace')
          candidates = []
          for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
              url = urljoin(base, unescape(raw))
              low = url.lower()
              if ('fichiers.touslesdrivers.com' in low or 'leica-camera.com' in low) and ('84657' in low or '.fw' in low):
                  if url not in candidates:
                      candidates.append(url)
          # Fallback to raw URL-like strings in JavaScript/HTML.
          for raw in re.findall(r'''https?://[^\s"'<>]+''', text, re.I):
              url = unescape(raw).replace('\\/', '/')
              low = url.lower()
              if ('fichiers.touslesdrivers.com' in low or 'leica-camera.com' in low) and ('84657' in low or '.fw' in low):
                  if url not in candidates:
                      candidates.append(url)
          for url in candidates:
              print(url)
          PY
            echo 'Resolved TLD candidate endpoints:'
            sed 's/[?].*/?…/' /tmp/tld_urls.txt || true
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              if try_url "$url" "$tld_popup"; then
                verified=1
                break
              fi
            done </tmp/tld_urls.txt
          fi

          [ "$verified" = 1 ]
          test -f /tmp/LEICA_M11-P_2.6.1.FW
          test "$(stat -c%s /tmp/LEICA_M11-P_2.6.1.FW)" = "$expected_size"
          echo "$expected_sha  /tmp/LEICA_M11-P_2.6.1.FW" | sha256sum -c -
          echo 'Exact firmware identity verified.'

      - name: Decompress and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/decompress_m11.py \
            /tmp/LEICA_M11-P_2.6.1.FW \
            -o /tmp/M11P_2.6.1_unpacked.bin
          test "$(stat -c%s /tmp/M11P_2.6.1_unpacked.bin)" = "97644400"
          echo '28528c24555f93ff69b6f6f4d47f8802719d47f5ddbe1d6dcad25d1840f35e3c  /tmp/M11P_2.6.1_unpacked.bin' | sha256sum -c -

      - name: Summarize open R2Y categories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          python tools/summarize_m11p_open_categories.py \
            /tmp/M11P_2.6.1_unpacked.bin \
            --json /tmp/r2a/open_categories.json \
            --markdown /tmp/r2a/open_categories.md
          cat /tmp/r2a/open_categories.md

      - name: Trace gamma strings to ROMFS consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          python tools/trace_m11_gamma_consumers.py \
            /tmp/M11P_2.6.1_unpacked.bin \
            --output /tmp/r2a/gamma_consumer_trace.md
          cat /tmp/r2a/gamma_consumer_trace.md

      - name: Upload derived R2A reports only
        uses: actions/upload-artifact@v4
        with:
          name: r2a-m11-gamma-consumer-trace
          path: |
            /tmp/r2a/gamma_consumer_trace.md
            /tmp/r2a/open_categories.json
            /tmp/r2a/open_categories.md
          if-no-files-found: error
          retention-days: 14
