name: M11 RENDER1A Canonical APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/apk1a-render1a

jobs:
  build-render1a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBRAW_COMMIT: b860248a89d9082b8e0a1e202e516f46af9adb29
      LIBRAW_CMAKE_COMMIT: eb98e4325aef2ce85d2eb031c2ff18640ca616d3
      NDK_VERSION: 27.2.12479018
      M11_LIBRAW_PATH: ${{ github.workspace }}/work/LibRaw
      M11_LIBRAW_CMAKE_PATH: ${{ github.workspace }}/work/LibRaw-cmake
      M11_REFERENCE_ASSET_SHA256: 54415604a45dc4ed704ebbbe6b089a946593032f464fdca0a86af6ef4be94219

    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen rawpy parity environment
        run: python -m pip install --disable-pip-version-check -r requirements/m11_raw_oracle.txt

      - name: Validate tooling and materialize exact canonical Android asset
        run: |
          set -euo pipefail
          python -m unittest tests.test_materialize_m11_reference_tables -v
          python -m py_compile tools/package_m11_apk_assets.py tools/materialize_m11_embedded_asset.py
          python tools/materialize_m11_embedded_asset.py
          test "$(wc -c < app/src/main/assets/m11_reference_tables_v1.bin)" -eq 23150
          test "$(sha256sum app/src/main/assets/m11_reference_tables_v1.bin | cut -d' ' -f1)" = "$M11_REFERENCE_ASSET_SHA256"
          python - <<'PY'
          from pathlib import Path
          b = Path('app/src/main/assets/m11_reference_tables_v1.bin').read_bytes()
          assert b[:8] == b'M11APK1A'
          assert b[-32:].hex() == '7d476331f39c00d28bd41986687c29e317dd81b466a4db174a1a3192863328e5'
          assert b[12:44].hex() == '0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83'
          PY

      - name: Generate parity and synthetic RAW diagnostic assets
        run: |
          set -euo pipefail
          python tools/validate_m11_raw_oracle_environment.py | tee M11_RAWPY_IDENTITY.json
          PYTHONPATH=. python tools/generate_m11_android_python_parity_fixture.py \
            --out app/src/test/resources/m11_python_android_parity_v1.b64
          mkdir -p app/src/main/assets work/rawpy_selftest
          python tools/generate_m11_synthetic_dng.py \
            --out app/src/main/assets/apk1a_synthetic.dng | tee M11_SYNTHETIC_DNG.txt
          python tools/dump_m11_rawpy_pixel_parity.py \
            app/src/main/assets/apk1a_synthetic.dng work/rawpy_selftest | tee M11_RAWPY_SELFTEST_DUMP.txt
          cp work/rawpy_selftest/mosaic_u16le.bin app/src/main/assets/apk1a_expected_mosaic_u16le.bin
          cp work/rawpy_selftest/ahd_u16le.bin app/src/main/assets/apk1a_expected_ahd_u16le.bin
          {
            echo 'schema=m11camera.android_synthetic_selftest_assets.v1'
            echo 'synthetic_only=true'
            echo 'rawpy=0.27.1'
            echo 'libraw=0.22.1'
            echo 'demosaic=AHD'
            sha256sum app/src/main/assets/apk1a_synthetic.dng
            sha256sum app/src/main/assets/apk1a_expected_mosaic_u16le.bin
            sha256sum app/src/main/assets/apk1a_expected_ahd_u16le.bin
          } > app/src/main/assets/apk1a_selftest_manifest.txt
          test "$(sha256sum app/src/main/assets/apk1a_synthetic.dng | cut -d' ' -f1)" = 'd9a2433c39f8705a0b47bb840dfbb96ccc0df16f66f542bb2af755324a26808b'
          test "$(sha256sum app/src/main/assets/apk1a_expected_mosaic_u16le.bin | cut -d' ' -f1)" = '422cd91c9d5e298062c92b288e983123842b86dd6475b7d10ad6eb57c37d0fa1'
          test "$(sha256sum app/src/main/assets/apk1a_expected_ahd_u16le.bin | cut -d' ' -f1)" = '1609ff7fc23cfff017b36f2d2956ca0b8fdac9359d372d23266ce96970e2492c'

      - name: Audit RENDER1A fail-closed boundaries
        run: |
          set -euo pipefail
          grep -q 'ASSET_SHA256 = "54415604a45dc4ed704ebbbe6b089a946593032f464fdca0a86af6ef4be94219"' app/src/main/java/com/m11/diagnostic/M11RenderWorkflow.java
          grep -q 'thirdSroApplied", false' app/src/main/java/com/m11/diagnostic/M11RenderWorkflow.java
          grep -q 'rendererMathChangedForHighlightIssue", false' app/src/main/java/com/m11/diagnostic/M11RenderWorkflow.java
          grep -q 'config.mode = m11::render::Mode::Standard' app/src/main/cpp/m11_render_jni.cpp
          grep -q 'applyRawpy0271OracleParams(raw.imgdata.params, false)' app/src/main/cpp/m11_render_jni.cpp
          grep -q 'additionalDownstreamSourceWB=false' app/src/main/cpp/m11_render_jni.cpp
          grep -q 'extraOutputOetf=false' app/src/main/cpp/m11_render_jni.cpp
          grep -q 'thirdSroApplied=false' app/src/main/cpp/m11_render_jni.cpp
          grep -q '0.1.4-render1a-canonical1a' app/build.gradle.kts
          ! grep -RniE 'LocalLaplacian|local_tone_mapping|hdr_merge|HDRMerge' native/m11_renderer/m11_reference_renderer_core.h app/src/main/cpp/m11_render_jni.cpp

      - name: Set up JDK 17 and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Fetch exact LibRaw sources for JNI build
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw.git "$M11_LIBRAW_PATH"
          git -C "$M11_LIBRAW_PATH" checkout --detach "$LIBRAW_COMMIT"
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw-cmake.git "$M11_LIBRAW_CMAKE_PATH"
          git -C "$M11_LIBRAW_CMAKE_PATH" checkout --detach "$LIBRAW_CMAKE_COMMIT"
          test "$(git -C "$M11_LIBRAW_PATH" rev-parse HEAD)" = "$LIBRAW_COMMIT"
          test "$(git -C "$M11_LIBRAW_CMAKE_PATH" rev-parse HEAD)" = "$LIBRAW_CMAKE_COMMIT"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests and build RENDER1A debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee M11_RENDER1A_GRADLE.log

      - name: Audit APK contents and canonical asset bytes
        if: success()
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$apk"
          unzip -l "$apk" | tee M11_RENDER1A_APK_CONTENTS.log
          grep -q 'lib/arm64-v8a/libm11rawjni.so' M11_RENDER1A_APK_CONTENTS.log
          grep -q 'assets/m11_reference_tables_v1.bin' M11_RENDER1A_APK_CONTENTS.log
          unzip -p "$apk" assets/m11_reference_tables_v1.bin > M11_APK_REFERENCE_ASSET.bin
          test "$(sha256sum M11_APK_REFERENCE_ASSET.bin | cut -d' ' -f1)" = "$M11_REFERENCE_ASSET_SHA256"
          sha256sum "$apk" | tee M11_RENDER1A_APK_SHA256.txt

      - name: Upload RENDER1A build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-RENDER1A-CANONICAL1A-buildlog
          path: |
            M11_RENDER1A_GRADLE.log
            M11_RENDER1A_APK_CONTENTS.log
            M11_RENDER1A_APK_SHA256.txt
            M11_RAWPY_IDENTITY.json
            M11_SYNTHETIC_DNG.txt
            M11_RAWPY_SELFTEST_DUMP.txt
          if-no-files-found: ignore

      - name: Upload RENDER1A debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M11Cam-RENDER1A-CANONICAL1A
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
