name: M11 APK1A Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - m11-apk1a

jobs:
  build-apk1a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Validate canonical-to-renderer table materializer
        run: |
          python -m unittest tests.test_materialize_m11_reference_tables -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run APK1A unit tests and build debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee M11_APK1A_GRADLE.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-APK1A-buildlog
          path: M11_APK1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload APK1A debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M11Cam-APK1A-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
