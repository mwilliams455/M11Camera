name: M11 APK1A Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - m11-apk1a
      - work/apk1a-realraw1c

jobs:
  build-apk1a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBRAW_COMMIT: b860248a89d9082b8e0a1e202e516f46af9adb29
      LIBRAW_CMAKE_COMMIT: eb98e4325aef2ce85d2eb031c2ff18640ca616d3
      NDK_VERSION: 27.2.12479018
      M11_LIBRAW_PATH: ${{ github.workspace }}/work/LibRaw
      M11_LIBRAW_CMAKE_PATH: ${{ github.workspace }}/work/LibRaw-cmake
    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen rawpy parity environment
        run: python -m pip install --disable-pip-version-check -r requirements/m11_raw_oracle.txt

      - name: Validate canonical tooling and generate renderer parity oracle
        run: |
          set -euo pipefail
          python -m unittest tests.test_materialize_m11_reference_tables -v
          python tools/validate_m11_raw_oracle_environment.py | tee M11_RAWPY_IDENTITY.json
          python -m py_compile \
            tools/package_m11_apk_assets.py \
            tools/generate_m11_android_python_parity_fixture.py \
            tools/generate_m11_synthetic_dng.py \
            tools/dump_m11_rawpy_pixel_parity.py
          PYTHONPATH=. python tools/generate_m11_android_python_parity_fixture.py \
            --out app/src/test/resources/m11_python_android_parity_v1.b64
          test -s app/src/test/resources/m11_python_android_parity_v1.b64

      - name: Generate bundled synthetic ARM self-test assets from rawpy oracle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets work/rawpy_selftest
          python tools/generate_m11_synthetic_dng.py \
            --out app/src/main/assets/apk1a_synthetic.dng \
            | tee M11_SYNTHETIC_DNG.txt
          python tools/dump_m11_rawpy_pixel_parity.py \
            app/src/main/assets/apk1a_synthetic.dng work/rawpy_selftest \
            | tee M11_RAWPY_SELFTEST_DUMP.txt
          cp work/rawpy_selftest/mosaic_u16le.bin \
            app/src/main/assets/apk1a_expected_mosaic_u16le.bin
          cp work/rawpy_selftest/ahd_u16le.bin \
            app/src/main/assets/apk1a_expected_ahd_u16le.bin
          {
            echo 'schema=m11camera.android_synthetic_selftest_assets.v1'
            echo 'synthetic_only=true'
            echo 'rawpy=0.27.1'
            echo 'libraw=0.22.1'
            echo 'demosaic=AHD'
            sha256sum app/src/main/assets/apk1a_synthetic.dng
            sha256sum app/src/main/assets/apk1a_expected_mosaic_u16le.bin
            sha256sum app/src/main/assets/apk1a_expected_ahd_u16le.bin
            wc -c app/src/main/assets/apk1a_synthetic.dng
            wc -c app/src/main/assets/apk1a_expected_mosaic_u16le.bin
            wc -c app/src/main/assets/apk1a_expected_ahd_u16le.bin
          } | tee app/src/main/assets/apk1a_selftest_manifest.txt
          test "$(sha256sum app/src/main/assets/apk1a_synthetic.dng | cut -d' ' -f1)" = \
            'd9a2433c39f8705a0b47bb840dfbb96ccc0df16f66f542bb2af755324a26808b'
          test "$(sha256sum app/src/main/assets/apk1a_expected_mosaic_u16le.bin | cut -d' ' -f1)" = \
            '422cd91c9d5e298062c92b288e983123842b86dd6475b7d10ad6eb57c37d0fa1'
          test "$(sha256sum app/src/main/assets/apk1a_expected_ahd_u16le.bin | cut -d' ' -f1)" = \
            '1609ff7fc23cfff017b36f2d2956ca0b8fdac9359d372d23266ce96970e2492c'
          test "$(wc -c < app/src/main/assets/apk1a_synthetic.dng)" -eq 2382
          test "$(wc -c < app/src/main/assets/apk1a_expected_mosaic_u16le.bin)" -eq 2048
          test "$(wc -c < app/src/main/assets/apk1a_expected_ahd_u16le.bin)" -eq 6144

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          test -f "$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Fetch exact LibRaw sources for JNI build
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw.git "$M11_LIBRAW_PATH"
          git -C "$M11_LIBRAW_PATH" checkout --detach "$LIBRAW_COMMIT"
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw-cmake.git "$M11_LIBRAW_CMAKE_PATH"
          git -C "$M11_LIBRAW_CMAKE_PATH" checkout --detach "$LIBRAW_CMAKE_COMMIT"
          test "$(git -C "$M11_LIBRAW_PATH" rev-parse HEAD)" = "$LIBRAW_COMMIT"
          test "$(git -C "$M11_LIBRAW_CMAKE_PATH" rev-parse HEAD)" = "$LIBRAW_CMAKE_COMMIT"
          grep -q '#define LIBRAW_MAJOR_VERSION 0' "$M11_LIBRAW_PATH/libraw/libraw_version.h"
          grep -q '#define LIBRAW_MINOR_VERSION 22' "$M11_LIBRAW_PATH/libraw/libraw_version.h"
          grep -q '#define LIBRAW_PATCH_VERSION 1' "$M11_LIBRAW_PATH/libraw/libraw_version.h"

      - name: Audit RAW JNI boundaries and decode gates
        run: |
          set -euo pipefail
          # The original user-selected identify path must remain decode-free.
          ! grep -nE '\.(unpack|dcraw_process|dcraw_make_mem_image|raw2image)\s*\(' \
            native/libraw_probe/m11_open_identify_core.h \
            app/src/main/cpp/m11_raw_jni.cpp
          grep -q 'open_datastream' native/libraw_probe/m11_open_identify_core.h
          python - <<'PY'
          from pathlib import Path

          synthetic = Path('app/src/main/cpp/m11_raw_selftest_jni.cpp').read_text()
          s_gate = synthetic.index('metadata/decoder gate failed')
          s_unpack = synthetic.index('raw.unpack()')
          s_process = synthetic.index('raw.dcraw_process()')
          assert s_gate < s_unpack < s_process
          assert 'kFixtureSize = 2382' in synthetic
          assert 'kWidth = 32' in synthetic and 'kHeight = 32' in synthetic
          assert 'APK1A Synthetic DNG' in synthetic

          real = Path('app/src/main/cpp/m11_realraw_probe_jni.cpp').read_text()
          r_gate = real.index('metadata/decoder gate failed')
          r_unpack = real.index('raw.unpack()')
          r_process = real.index('raw.dcraw_process()')
          assert r_gate < r_unpack < r_process
          assert 'kWidth = 4096' in real and 'kHeight = 3072' in real
          assert '25010PN30G' in real
          assert 'packed_dng_load_raw()' in real
          assert 'm11RendererInvoked=false' in real
          assert 'applyRawpy0271OracleParams(raw.imgdata.params, false)' in real

          export = Path('app/src/main/cpp/m11_realraw_export_jni.cpp').read_text()
          e_gate = export.index('metadata/decoder gate failed')
          e_unpack = export.index('raw.unpack()')
          e_process = export.index('raw.dcraw_process()')
          e_gzip = export.index('gzdopen')
          assert e_gate < e_unpack < e_process < e_gzip
          assert 'kWidth = 4096' in export and 'kHeight = 3072' in export
          assert 'kFilters = 0xb4b4b4b4u' in export
          assert 'kMaximum = 1023' in export
          assert '25010PN30G' in export
          assert 'packed_dng_load_raw()' in export
          assert 'applyRawpy0271OracleParams(raw.imgdata.params, false)' in export
          assert 'gzdopen(gzip_fd, "wb1")' in export
          assert 'exportFormat=gzip(raw interleaved RGB uint16 little-endian)' in export
          assert 'm11RendererInvoked=false' in export

          bridge = Path('app/src/main/java/com/m11/diagnostic/M11RealRawProbeBridge.java').read_text()
          assert 'nativeExportRealXiaomiAhdFd' in bridge
          activity = Path('app/src/main/java/com/m11/diagnostic/MainActivity.java').read_text()
          assert 'ACTION_CREATE_DOCUMENT' in activity
          assert 'M11_REALRAW1C_AHD_u16le.bin.gz' in activity
          gradle = Path('app/build.gradle.kts').read_text()
          assert '0.1.3-apk1a-realraw1c' in gradle
          PY

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run APK1A unit tests and build debug APK with native bridges
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee M11_APK1A_GRADLE.log

      - name: Audit APK contains arm64 JNI and exact synthetic self-test assets
        if: success()
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$apk"
          unzip -l "$apk" | tee M11_APK1A_APK_CONTENTS.log
          grep -q 'lib/arm64-v8a/libm11rawjni.so' M11_APK1A_APK_CONTENTS.log
          grep -q 'assets/apk1a_synthetic.dng' M11_APK1A_APK_CONTENTS.log
          grep -q 'assets/apk1a_expected_mosaic_u16le.bin' M11_APK1A_APK_CONTENTS.log
          grep -q 'assets/apk1a_expected_ahd_u16le.bin' M11_APK1A_APK_CONTENTS.log
          grep -q 'assets/apk1a_selftest_manifest.txt' M11_APK1A_APK_CONTENTS.log
          ! grep -q 'lib/x86/' M11_APK1A_APK_CONTENTS.log
          ! grep -q 'lib/x86_64/' M11_APK1A_APK_CONTENTS.log
          ! grep -q 'lib/armeabi-v7a/' M11_APK1A_APK_CONTENTS.log
          sha256sum "$apk" | tee M11_APK1A_SHA256.txt

      - name: Upload build and self-test provenance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-APK1A-buildlog
          path: |
            M11_APK1A_GRADLE.log
            M11_APK1A_APK_CONTENTS.log
            M11_APK1A_SHA256.txt
            M11_RAWPY_IDENTITY.json
            M11_SYNTHETIC_DNG.txt
            M11_RAWPY_SELFTEST_DUMP.txt
            app/src/main/assets/apk1a_selftest_manifest.txt
          if-no-files-found: ignore

      - name: Upload APK1A debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M11Cam-APK1A-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
