name: M11 pinned LibRaw host parity binary

on:
  workflow_dispatch:
  push:
    branches:
      - work/apk1a-realraw1b
    paths:
      - '.github/workflows/m11-libraw-pinned-host-binary.yml'

permissions:
  contents: read

jobs:
  build-host-parity-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBRAW_COMMIT: b860248a89d9082b8e0a1e202e516f46af9adb29
      LIBRAW_CMAKE_COMMIT: eb98e4325aef2ce85d2eb031c2ff18640ca616d3
    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Fetch exact LibRaw sources
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw.git work/LibRaw
          git -C work/LibRaw checkout --detach "$LIBRAW_COMMIT"
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw-cmake.git work/LibRaw-cmake
          git -C work/LibRaw-cmake checkout --detach "$LIBRAW_CMAKE_COMMIT"
          test "$(git -C work/LibRaw rev-parse HEAD)" = "$LIBRAW_COMMIT"
          test "$(git -C work/LibRaw-cmake rev-parse HEAD)" = "$LIBRAW_CMAKE_COMMIT"

      - name: Write parity dumper CMake project
        run: |
          set -euo pipefail
          mkdir -p work/pixel_probe
          cat > work/pixel_probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(m11_raw_pixel_parity LANGUAGES C CXX)
          set(LIBRAW_PATH "${CMAKE_CURRENT_LIST_DIR}/../LibRaw" CACHE STRING "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(ENABLE_OPENMP OFF CACHE BOOL "" FORCE)
          set(ENABLE_LCMS OFF CACHE BOOL "" FORCE)
          set(ENABLE_JASPER OFF CACHE BOOL "" FORCE)
          set(ENABLE_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(ENABLE_RAWSPEED OFF CACHE BOOL "" FORCE)
          set(ENABLE_DCRAW_DEBUG OFF CACHE BOOL "" FORCE)
          set(ENABLE_X3FTOOLS OFF CACHE BOOL "" FORCE)
          set(ENABLE_6BY9RPI OFF CACHE BOOL "" FORCE)
          set(LIBRAW_INSTALL OFF CACHE BOOL "" FORCE)
          set(LIBRAW_UNINSTALL_TARGET OFF CACHE BOOL "" FORCE)
          add_subdirectory("${CMAKE_CURRENT_LIST_DIR}/../LibRaw-cmake" "${CMAKE_BINARY_DIR}/libraw")
          add_executable(m11rawpixeldump "${CMAKE_CURRENT_LIST_DIR}/../../native/libraw_probe/m11_raw_pixel_parity_dump.cpp")
          target_compile_features(m11rawpixeldump PRIVATE cxx_std_17)
          target_include_directories(m11rawpixeldump PRIVATE "${CMAKE_CURRENT_LIST_DIR}/../../native/libraw_probe")
          target_link_libraries(m11rawpixeldump PRIVATE libraw::libraw)
          CMAKE

      - name: Build GCC host dumper
        run: |
          set -euo pipefail
          cmake -S work/pixel_probe -B work/pixel_build_gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build work/pixel_build_gcc --target m11rawpixeldump --parallel 2
          exe=$(find work/pixel_build_gcc -name m11rawpixeldump -type f -perm -111 -print -quit)
          test -n "$exe"
          mkdir -p host_binaries
          cp "$exe" host_binaries/m11rawpixeldump-gcc
          chmod 755 host_binaries/m11rawpixeldump-gcc

      - name: Build Clang host dumper
        run: |
          set -euo pipefail
          clang --version | head -1
          cmake -S work/pixel_probe -B work/pixel_build_clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build work/pixel_build_clang --target m11rawpixeldump --parallel 2
          exe=$(find work/pixel_build_clang -name m11rawpixeldump -type f -perm -111 -print -quit)
          test -n "$exe"
          cp "$exe" host_binaries/m11rawpixeldump-clang
          chmod 755 host_binaries/m11rawpixeldump-clang

      - name: Record provenance
        run: |
          set -euo pipefail
          sha256sum host_binaries/m11rawpixeldump-* | tee host_binaries/SHA256.txt
          {
            echo "libraw_commit=$LIBRAW_COMMIT"
            echo "libraw_cmake_commit=$LIBRAW_CMAKE_COMMIT"
            echo "runner=ubuntu-24.04"
            gcc --version | head -1
            clang --version | head -1
          } | tee host_binaries/PROVENANCE.txt
          ldd host_binaries/m11rawpixeldump-gcc > host_binaries/LDD-GCC.txt
          ldd host_binaries/m11rawpixeldump-clang > host_binaries/LDD-CLANG.txt

      - name: Upload host parity binaries
        uses: actions/upload-artifact@v4
        with:
          name: M11-pinned-LibRaw-host-parity-binaries-gcc-clang
          path: host_binaries/
          if-no-files-found: error
          retention-days: 14
