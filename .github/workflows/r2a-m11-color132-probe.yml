name: R2A M11 COLOR132 probe
on:
  push:
    branches: [work/render1h-cat42yq3a-placement1a]
    paths:
      - 'tools/probe_m11_upstream_color132.py'
      - 'tools/m11_romfs_probe.py'
      - '.github/workflows/r2a-m11-color132-probe.yml'
      - 'tools/decompress_m11.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact updater
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'; size='63621633'; sha='0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83'; out=/tmp/LEICA_M11-P_2.6.1.FW
          verify(){ [ -f "$out" ] && [ "$(stat -c%s "$out")" = "$size" ] && [ "$(sha256sum "$out"|awk '{print $1}')" = "$sha" ]; }
          for url in 'https://www.leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW' 'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW?download=1'; do curl --http1.1 -L --fail --retry 1 -A "$ua" -o "$out" "$url" || true; verify && break; done
          if ! verify; then
            popup='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'; curl --http1.1 -L --fail -A "$ua" -o /tmp/tld.html "$popup"
            python - <<'PY' >/tmp/urls
          import re
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin
          b='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr';t=Path('/tmp/tld.html').read_text(errors='replace')
          for x in dict.fromkeys(urljoin(b,unescape(x)) for x in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',t,re.I)):
           if ('fichiers.touslesdrivers.com' in x.lower() or 'leica-camera.com' in x.lower()) and ('84657' in x.lower() or '.fw' in x.lower()): print(x)
          PY
            while read -r url; do curl --http1.1 -L --fail -A "$ua" -e "$popup" -o "$out" "$url" || true; verify && break; done </tmp/urls
          fi
          verify
      - name: Decompress and verify
        run: |
          python tools/decompress_m11.py /tmp/LEICA_M11-P_2.6.1.FW -o /tmp/M11P.bin
          echo '28528c24555f93ff69b6f6f4d47f8802719d47f5ddbe1d6dcad25d1840f35e3c  /tmp/M11P.bin' | sha256sum -c -
      - name: Probe neutral 132-byte object
        run: |
          mkdir -p /tmp/color132
          python tools/probe_m11_upstream_color132.py /tmp/M11P.bin --out /tmp/color132/color132_probe.json | tee /tmp/color132/summary.txt
          python - <<'PY' >/tmp/color132/compact.txt
          import json
          p=json.load(open('/tmp/color132/color132_probe.json'))
          print('summary',p['summary'])
          for s in p['whole_image_scans']:
              print('whole',s['endian'],'hits',s['signature_hits'])
              print('candidates',len(s['candidate_windows']))
              for c in s['candidate_windows'][:20]:
                  print(' candidate',hex(c['start']),c['signature_word_offsets'],c['recorded_temperature_word_positions'],c['contains_both_recorded_temperatures'],c['words'])
          for r in p['romfs_matches']:
              print('romfs',r['romfs_index'],r['romfs_volume'],r['file_path'],r['endian'],'hits',r['signature_hits_file_relative'])
              for c in r['candidate_windows'][:20]:
                  print(' candidate file',hex(c['start_file_relative']),'abs',hex(c['absolute_firmware_offset']),c['signature_word_offsets'],c['recorded_temperature_word_positions'],c['words'])
          PY
          cat /tmp/color132/compact.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2a-m11-color132-probe
          path: /tmp/color132/*
          retention-days: 14
