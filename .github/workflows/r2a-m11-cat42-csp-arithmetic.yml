name: R2A M11 Cat42 CSP arithmetic

on:
  push:
    branches: [work/render1g-cat42c1a-orient1a]
    paths:
      - '.github/workflows/r2a-m11-cat42-csp-arithmetic.yml'
      - 'tools/analyze_m11_cat42_csp_arithmetic.py'
      - 'tools/prepare_milbeaut_csp_compile.py'
      - 'tools/match_milbeaut_csp_fingerprint.py'
      - 'tools/match_milbeaut_object_fingerprints.py'
      - 'tools/prepare_milbeaut_r2y_compile.py'
      - 'tools/extract_m11p_forensics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cat42-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout M11 research branch
        uses: actions/checkout@v4

      - name: Checkout exact public Milbeaut source
        uses: actions/checkout@v4
        with:
          repository: ZMlogicL/companyTask
          ref: f5fc84bd5c475f4c15017b7bff749f81c3618287
          path: public-milbeaut
          fetch-depth: 1
          sparse-checkout: |
            MILB_API
          sparse-checkout-cone-mode: true

      - name: Verify public source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-milbeaut rev-parse HEAD)" = 'f5fc84bd5c475f4c15017b7bff749f81c3618287'

      - name: Acquire exact hash-gated M11-P updater
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'
          expected_size='63621633'
          expected_sha='0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83'
          out=/tmp/LEICA_M11-P_2.6.1.FW
          verify() { [ -f "$out" ] && [ "$(stat -c%s "$out")" = "$expected_size" ] && [ "$(sha256sum "$out" | awk '{print $1}')" = "$expected_sha" ]; }
          rm -f "$out"
          for url in \
            'https://www.leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW' \
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW?download=1'; do
            curl --http1.1 -L --fail --retry 1 --retry-all-errors -A "$ua" \
              -e 'https://leica-camera.com/en-GB/photography/cameras/m/m11-p-black/downloads' \
              -o "$out" "$url" || true
            if verify; then break; fi
          done
          if ! verify; then
            popup='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
            curl --http1.1 -L --fail -A "$ua" -o /tmp/tld.html "$popup"
            python - <<'PY' >/tmp/tld_urls.txt
          import re
          from pathlib import Path
          from html import unescape
          from urllib.parse import urljoin
          base='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
          text=Path('/tmp/tld.html').read_text(errors='replace')
          out=[]
          for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
              url=urljoin(base, unescape(raw)); low=url.lower()
              if ('fichiers.touslesdrivers.com' in low or 'leica-camera.com' in low) and ('84657' in low or '.fw' in low) and url not in out:
                  out.append(url)
          print('\n'.join(out))
          PY
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              rm -f "$out"
              curl --http1.1 -L --fail -A "$ua" -e "$popup" -o "$out" "$url" || true
              if verify; then break; fi
            done </tmp/tld_urls.txt
          fi
          verify
          echo "$expected_sha  $out" | sha256sum -c -

      - name: Decompress and verify exact M11-P image
        shell: bash
        run: |
          set -euo pipefail
          python tools/decompress_m11.py /tmp/LEICA_M11-P_2.6.1.FW -o /tmp/M11P.bin
          test "$(stat -c%s /tmp/M11P.bin)" = '97644400'
          echo '28528c24555f93ff69b6f6f4d47f8802719d47f5ddbe1d6dcad25d1840f35e3c  /tmp/M11P.bin' | sha256sum -c -

      - name: Analyze all Category-42 maps and fixed-point continuity hypotheses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cat42
          python tools/analyze_m11_cat42_csp_arithmetic.py /tmp/M11P.bin \
            --json /tmp/cat42/cat42_csp_arithmetic.json \
            --markdown /tmp/cat42/cat42_csp_arithmetic.md
          cat /tmp/cat42/cat42_csp_arithmetic.md

      - name: Install exact ARM Embedded GCC 4.9 Q3 toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gcc-arm.tar.bz2
          rm -f "$archive"
          for url in \
            'https://firmware.ardupilot.org/Tools/STM32-tools/archived/gcc-arm-none-eabi-4_9-2015q3-20150921-linux.tar.bz2' \
            'https://launchpad.net/gcc-arm-embedded/4.9/4.9-2015-q3-update/+download/gcc-arm-none-eabi-4_9-2015q3-20150921-linux.tar.bz2'; do
            echo "Trying exact GCC archive: $url"
            rm -f "$archive"
            if curl -L --fail --connect-timeout 10 --max-time 90 --retry 1 --retry-all-errors -o "$archive" "$url"; then
              break
            fi
          done
          test -s "$archive"
          rm -rf /tmp/gcc-arm
          mkdir -p /tmp/gcc-arm
          tar -xjf "$archive" -C /tmp/gcc-arm --strip-components=1
          /tmp/gcc-arm/bin/arm-none-eabi-gcc --version | tee /tmp/cat42/gcc-version.txt
          grep -q '4.9.3 20150529' /tmp/cat42/gcc-version.txt

      - name: Prepare exact public CSP source without processing changes
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_milbeaut_csp_compile.py public-milbeaut/MILB_API | tee /tmp/cat42/csp-prepare.txt

      - name: Compile public Milbeaut CSP object
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/ImageMacro"
          cd "$SRC"
          rm -rf obj dep asm
          mkdir -p obj dep asm
          PREFIX=/tmp/gcc-arm/bin/arm-none-eabi-
          set +e
          make GNUarm="$PREFIX" ENABLE_NEON=y PRIORITY_OPTION=fast obj/imr2yctrl3.o 2>&1 | tee /tmp/cat42/csp-compile.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          echo "make_rc=$MAKE_RC" | tee /tmp/cat42/csp-compile-status.txt
          test -s obj/imr2yctrl3.o || { echo 'ERROR: imr2yctrl3.o not produced' >&2; exit 1; }
          "$PREFIX"readelf -h obj/imr2yctrl3.o | grep -Eq 'Machine:[[:space:]]+ARM'
          "$PREFIX"nm -S --size-sort obj/imr2yctrl3.o | grep -Ei 'chroma.*suppress|suppress.*chroma|imR2ySetRdmaValChromaSuppress' \
            | tee /tmp/cat42/csp-symbols.txt || true
          "$PREFIX"objdump -dr obj/imr2yctrl3.o | grep -Ei -A40 -B8 'chroma.*suppress|suppress.*chroma|imR2ySetRdmaValChromaSuppress' \
            | head -n 800 > /tmp/cat42/csp-disassembly.txt || true

      - name: Match CSP setter against exact Leica image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyelftools capstone
          python tools/match_milbeaut_csp_fingerprint.py \
            /tmp/M11P.bin \
            "$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/ImageMacro/obj/imr2yctrl3.o" \
            --output /tmp/cat42/milbeaut_csp_fingerprint.md
          cat /tmp/cat42/milbeaut_csp_fingerprint.md

      - name: Upload derived CSP research only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2a-m11-cat42-csp-arithmetic
          path: /tmp/cat42/*
          retention-days: 14
          if-no-files-found: warn
