name: R2A M11 Milbeaut compiler fingerprint

on:
  push:
    branches: [research/m11-r0-evidence-input-space]
    paths:
      - '.github/workflows/r2a-m11-milbeaut-compiler-fingerprint.yml'
      - 'tools/match_milbeaut_object_fingerprints.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout M11 research
        uses: actions/checkout@v4

      - name: Checkout exact public Milbeaut source sparsely
        uses: actions/checkout@v4
        with:
          repository: ZMlogicL/companyTask
          ref: f5fc84bd5c475f4c15017b7bff749f81c3618287
          path: public-milbeaut
          fetch-depth: 1
          sparse-checkout: |
            MILB_API
          sparse-checkout-cone-mode: true

      - name: Verify public source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-milbeaut rev-parse HEAD)" = 'f5fc84bd5c475f4c15017b7bff749f81c3618287'

      - name: Acquire exact hash-gated M11-P updater
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'
          expected_size='63621633'
          expected_sha='0618ccb180cf3aa8979b04c0851e127753cd6aff3aaffee737abc52388363b83'
          out=/tmp/LEICA_M11-P_2.6.1.FW
          verify() { [ -f "$out" ] && [ "$(stat -c%s "$out")" = "$expected_size" ] && [ "$(sha256sum "$out"|awk '{print $1}')" = "$expected_sha" ]; }
          rm -f "$out"
          for url in \
            'https://www.leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW' \
            'https://leica-camera.com/sites/default/files/LEICA_M11-P_2.6.1.FW?download=1'; do
            curl --http1.1 -L --fail --retry 1 --retry-all-errors -A "$ua" -e 'https://leica-camera.com/en-GB/photography/cameras/m/m11-p-black/downloads' -o "$out" "$url" || true
            if verify; then break; fi
          done
          if ! verify; then
            popup='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
            curl --http1.1 -L --fail -A "$ua" -o /tmp/tld.html "$popup"
            python - <<'PY' >/tmp/tld_urls.txt
          import re
          from pathlib import Path
          from html import unescape
          from urllib.parse import urljoin
          base='https://www.touslesdrivers.com/php/constructeurs/telechargement.php?v_code=84657&v_langue=fr'
          t=Path('/tmp/tld.html').read_text(errors='replace'); out=[]
          for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',t,re.I):
              u=urljoin(base,unescape(raw)); l=u.lower()
              if ('fichiers.touslesdrivers.com' in l or 'leica-camera.com' in l) and ('84657' in l or '.fw' in l) and u not in out: out.append(u)
          print('\n'.join(out))
          PY
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              rm -f "$out"
              curl --http1.1 -L --fail -A "$ua" -e "$popup" -o "$out" "$url" || true
              if verify; then break; fi
            done </tmp/tld_urls.txt
          fi
          verify
          echo "$expected_sha  $out" | sha256sum -c -

      - name: Decompress and verify exact image
        shell: bash
        run: |
          set -euo pipefail
          python tools/decompress_m11.py /tmp/LEICA_M11-P_2.6.1.FW -o /tmp/M11P.bin
          test "$(stat -c%s /tmp/M11P.bin)" = '97644400'
          echo '28528c24555f93ff69b6f6f4d47f8802719d47f5ddbe1d6dcad25d1840f35e3c  /tmp/M11P.bin' | sha256sum -c -

      - name: Install exact ARM Embedded GCC 4.9 Q3 toolchain
        shell: bash
        run: |
          set -euo pipefail
          url='https://launchpad.net/gcc-arm-embedded/4.9/4.9-2015-q3-update/+download/gcc-arm-none-eabi-4_9-2015q3-20150921-linux.tar.bz2'
          curl -L --fail --retry 2 --retry-all-errors -o /tmp/gcc-arm.tar.bz2 "$url"
          mkdir -p /tmp/gcc-arm
          tar -xjf /tmp/gcc-arm.tar.bz2 -C /tmp/gcc-arm --strip-components=1
          /tmp/gcc-arm/bin/arm-none-eabi-gcc --version | tee /tmp/gcc-version.txt
          grep -q '4.9.3 20150529' /tmp/gcc-version.txt

      - name: Supply compile-only ETK compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          # MILB_API/include/klib.h refers outside the pinned repository to
          # ../../../fj/klib/src/kobject.h. Recreate only primitive ETK
          # declarations needed to compile the unmodified ImageMacro units.
          # Target gamma routines do not use object-private state, and the
          # matcher masks relocations/link-sensitive branch words.
          SHIM="$GITHUB_WORKSPACE/fj/klib/src/kobject.h"
          mkdir -p "$(dirname "$SHIM")"
          cat >"$SHIM" <<'EOF'
          #ifndef R2A_COMPILE_ONLY_KOBJECT_H
          #define R2A_COMPILE_ONLY_KOBJECT_H
          #include <stddef.h>
          typedef signed char kint8;
          typedef unsigned char kuint8;
          typedef signed short kint16;
          typedef unsigned short kuint16;
          typedef signed int kint32;
          typedef unsigned int kuint32;
          typedef signed long long kint64;
          typedef unsigned long long kuint64;
          typedef signed long klong;
          typedef unsigned long kulong;
          typedef void VOID;
          typedef char CHAR;
          typedef unsigned char UCHAR;
          typedef signed char INT8;
          typedef unsigned char UINT8;
          typedef signed short SHORT;
          typedef unsigned short USHORT;
          typedef signed short INT16;
          typedef unsigned short UINT16;
          typedef signed int INT32;
          typedef unsigned int UINT32;
          typedef signed long LONG;
          typedef unsigned long ULONG;
          typedef signed long long LLONG;
          typedef unsigned long long ULLONG;
          typedef int BOOL;
          typedef float FLOAT;
          typedef double DOUBLE;
          typedef unsigned long KConstType;
          typedef struct _KObject { void *opaque; } KObject;
          #ifndef NULL
          #define NULL ((void *)0)
          #endif
          #ifndef TRUE
          #define TRUE 1
          #endif
          #ifndef FALSE
          #define FALSE 0
          #endif
          #define K_TYPE_CHECK_INSTANCE_CAST(obj, TypeName) ((TypeName *)(obj))
          #define K_TYPE_CHECK_INSTANCE_TYPE(obj, type_id) (1)
          #define K_OBJECT_GET_PRIVATE(obj, PrivateType, type_id) ((PrivateType *)0)
          #define K_TYPE_DEFINE_WITH_PRIVATE(TypeName, type_name)
          extern void *k_object_new_with_private(KConstType type_id, unsigned long private_size);
          #endif
          EOF
          test -s "$SHIM"
          test "$(realpath "$GITHUB_WORKSPACE/public-milbeaut/MILB_API/include/../../../fj/klib/src/kobject.h")" = "$SHIM"

          # The refactored public tree contains the expected Socionext headers under
          # inconsistent filenames/locations. Link exact pinned files into the names
          # expected by ImageMacro, then repair only obvious mechanical refactor
          # defects in the compatibility copy (no R2Y processing code is changed).
          INC="$GITHUB_WORKSPACE/public-milbeaut/MILB_API/include"
          cp "$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/DeviceDriver/ARM/src/ddimtypedef.h" "$INC/ddim_typedef.h"
          cp "$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/PalladiumTest/src/ddimusercustom.h" "$INC/ddimusercustom.h"
          sed -i 's/(DdimUserCustom \*self,VOID)/(DdimUserCustom *self)/g' "$INC/ddimusercustom.h"
          sed -i '/#endif[[:space:]]*\/\/[[:space:]]*_DDIM_USER_CUSTOM_H_/d' "$INC/ddimusercustom.h"
          ln -sf ddimusercustom.h "$INC/ddim_user_custom.h"
          test -s "$INC/ddim_typedef.h"
          test -s "$INC/ddimusercustom.h"
          test -s "$INC/ddim_user_custom.h"

          # Public change notes document these two generated R2Y register headers as
          # renamed during the ETK refactor, while jdsr2yf2e.h still includes their
          # original names. Alias the exact pinned replacements; do not synthesize
          # register definitions.
          REGINC="$GITHUB_WORKSPACE/public-milbeaut/MILB_API/MILB_Header/include/Image"
          ln -sf fr2y6a.h "$REGINC/__fr2y6a.h"
          ln -sf jdsr2yf2esram.h "$REGINC/__jdsr2y_f2e_sram.h"
          test -s "$REGINC/__fr2y6a.h"
          test -s "$REGINC/__jdsr2y_f2e_sram.h"

      - name: Compile target Milbeaut R2Y objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          SRC="$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/ImageMacro"
          cd "$SRC"
          rm -rf obj dep asm
          mkdir -p obj dep asm
          PREFIX=/tmp/gcc-arm/bin/arm-none-eabi-

          # Capture the exact compiler stream before explicit object validation.
          # The public make recipes prefix compile commands with '-', so make's own
          # status cannot be trusted as the sole failure signal.
          set +e
          make GNUarm="$PREFIX" ENABLE_NEON=y PRIORITY_OPTION=fast \
            obj/imr2yset.o obj/imr2yctrl2.o 2>&1 | tee /tmp/r2a/compile.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          {
            echo "make_rc=$MAKE_RC"
            echo "compiler=$(${PREFIX}gcc --version | head -n1)"
            echo
            grep -E -m 80 'fatal error:|(^|[[:space:]])error:|undefined reference|No such file or directory' /tmp/r2a/compile.log || true
          } > /tmp/r2a/compile-errors.txt
          cat /tmp/r2a/compile-errors.txt

          # Missing/empty target objects remain authoritative and fatal.
          for o in obj/imr2yset.o obj/imr2yctrl2.o; do
            test -s "$o" || { echo "ERROR: target object not produced: $o" >&2; exit 1; }
            "$PREFIX"readelf -h "$o" | grep -Eq 'Machine:[[:space:]]+ARM'
          done

          for o in obj/imr2yset.o obj/imr2yctrl2.o; do
            echo "===== $o ====="
            "$PREFIX"nm -S --size-sort "$o" | grep -Ei 'gamma|r2y_set_gamma|r2y_ctrl2_gamma' || true
            "$PREFIX"objdump -dr "$o" | grep -Ei -A12 -B4 'gamma|set_gamma|ctrl2_gamma' | head -n 400 || true
          done | tee /tmp/milbeaut-build-summary.txt

      - name: Upload concise compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2a-m11-milbeaut-compile-diagnostics
          path: |
            /tmp/r2a/compile-errors.txt
            /tmp/gcc-version.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Install fingerprint dependencies
        run: python -m pip install --quiet pyelftools capstone

      - name: Match relocation-free object fingerprints to M11
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a
          SRC="$GITHUB_WORKSPACE/public-milbeaut/MILB_API/Project/ImageMacro/obj"
          python tools/match_milbeaut_object_fingerprints.py \
            /tmp/M11P.bin \
            "$SRC/imr2yset.o" \
            "$SRC/imr2yctrl2.o" \
            --output /tmp/r2a/milbeaut_object_fingerprints.md
          cat /tmp/r2a/milbeaut_object_fingerprints.md
          cp /tmp/gcc-version.txt /tmp/r2a/gcc-version.txt
          cp /tmp/milbeaut-build-summary.txt /tmp/r2a/milbeaut-build-summary.txt

      - name: Upload derived reports only
        uses: actions/upload-artifact@v4
        with:
          name: r2a-m11-milbeaut-compiler-fingerprint
          path: /tmp/r2a/*
          retention-days: 14
          if-no-files-found: error
