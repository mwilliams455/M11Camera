name: R2A M11 internal entry A/B
on:
  push:
    branches: [work/render1h-cat42yq3a-placement1a]
    paths:
      - 'tools/compare_m11_internal_entry_ab.py'
      - 'tools/m11_internal_entry_reference.py'
      - 'tools/render_xiaomi_m11_controlled.py'
      - 'tests/test_m11_internal_entry_ab.py'
      - 'tests/test_m11_internal_entry_reference.py'
      - 'renderer/m11_core/reference_basis.py'
      - 'renderer/reference/leica_m11_reference_renderer.py'
      - '.github/workflows/r2a-m11-internal-entry-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet numpy
      - name: Compile diagnostic harness
        run: python -m py_compile tools/compare_m11_internal_entry_ab.py
      - name: Run internal-entry references and A/B tests
        run: |
          python -m unittest tests.test_m11_internal_entry_reference -v
          python -m unittest tests.test_m11_internal_entry_ab -v
