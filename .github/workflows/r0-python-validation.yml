name: R0 Python validation

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference-renderer dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile recovered/reference Python tools
        run: |
          python -m py_compile tools/decompress_m11.py
          python -m py_compile tools/m11_romfs_probe.py
          python -m py_compile tools/probe_r2y_recorded_signatures.py
          python -m py_compile tools/probe_m11_extracted_assets.py
          python -m py_compile tools/probe_m11_corpus.py
          python -m py_compile tools/probe_m11_pixel_chroma_fast.py
          python -m py_compile renderer/reference/leica_m11_reference_renderer.py
          python -m py_compile renderer/reference/validate_forensics_data.py
          python -m py_compile renderer/source_adapter/dng_dual_illuminant.py
          python -m py_compile renderer/m11_core/reference_basis.py

      - name: Run proprietary-free recovery/source tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Explain table-validation gate
        run: |
          echo 'Firmware binaries remain ephemeral and are never committed.'
          echo 'Derived tables are accepted only after the recorded firmware constraints reproduce.'
