name: M11 APK1A LibRaw Android Probe

on:
  workflow_dispatch:
  push:
    branches:
      - m11-apk1a
    paths:
      - 'native/libraw_probe/**'
      - '.github/workflows/m11-apk1a-libraw-android-probe.yml'

permissions:
  contents: read

jobs:
  android-arm64-link-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBRAW_COMMIT: b860248a89d9082b8e0a1e202e516f46af9adb29
      LIBRAW_CMAKE_COMMIT: eb98e4325aef2ce85d2eb031c2ff18640ca616d3
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          test -f "$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Fetch pinned LibRaw sources and CMake wrapper
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw.git work/LibRaw
          git -C work/LibRaw checkout --detach "$LIBRAW_COMMIT"
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw-cmake.git work/LibRaw-cmake
          git -C work/LibRaw-cmake checkout --detach "$LIBRAW_CMAKE_COMMIT"
          test "$(git -C work/LibRaw rev-parse HEAD)" = "$LIBRAW_COMMIT"
          test "$(git -C work/LibRaw-cmake rev-parse HEAD)" = "$LIBRAW_CMAKE_COMMIT"
          grep -q '#define LIBRAW_MAJOR_VERSION 0' work/LibRaw/libraw/libraw_version.h
          grep -q '#define LIBRAW_MINOR_VERSION 22' work/LibRaw/libraw/libraw_version.h
          grep -q '#define LIBRAW_PATCH_VERSION 1' work/LibRaw/libraw/libraw_version.h

      - name: Configure isolated Android arm64 probe
        run: |
          set -euo pipefail
          mkdir -p work/probe
          cat > work/probe/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(m11_libraw_android_probe LANGUAGES C CXX)

          set(LIBRAW_PATH "${CMAKE_CURRENT_LIST_DIR}/../LibRaw" CACHE STRING "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(ENABLE_OPENMP OFF CACHE BOOL "" FORCE)
          set(ENABLE_LCMS OFF CACHE BOOL "" FORCE)
          set(ENABLE_JASPER OFF CACHE BOOL "" FORCE)
          set(ENABLE_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(ENABLE_RAWSPEED OFF CACHE BOOL "" FORCE)
          set(ENABLE_DCRAW_DEBUG OFF CACHE BOOL "" FORCE)
          set(ENABLE_X3FTOOLS OFF CACHE BOOL "" FORCE)
          set(ENABLE_6BY9RPI OFF CACHE BOOL "" FORCE)
          set(LIBRAW_INSTALL OFF CACHE BOOL "" FORCE)
          set(LIBRAW_UNINSTALL_TARGET OFF CACHE BOOL "" FORCE)

          add_subdirectory("${CMAKE_CURRENT_LIST_DIR}/../LibRaw-cmake" "${CMAKE_BINARY_DIR}/libraw")

          add_library(m11rawprobe SHARED "${CMAKE_CURRENT_LIST_DIR}/../../native/libraw_probe/m11_libraw_probe.cpp")
          target_compile_features(m11rawprobe PRIVATE cxx_std_17)
          target_compile_options(m11rawprobe PRIVATE -fvisibility=hidden)
          target_link_libraries(m11rawprobe PRIVATE libraw::libraw)
          CMAKE

          cmake -S work/probe -B work/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            | tee work/configure.log

      - name: Build and audit arm64 shared object
        run: |
          set -euo pipefail
          cmake --build work/build --target m11rawprobe --parallel 2 | tee work/build.log
          so=$(find work/build -name 'libm11rawprobe.so' -type f -print -quit)
          test -n "$so"
          cp "$so" work/libm11rawprobe.so

          toolbin="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "libraw_commit=$LIBRAW_COMMIT"
            echo "libraw_cmake_commit=$LIBRAW_CMAKE_COMMIT"
            echo "ndk_version=$NDK_VERSION"
            echo "android_abi=arm64-v8a"
            echo "android_platform=26"
            sha256sum work/libm11rawprobe.so
            file work/libm11rawprobe.so
            "$toolbin/llvm-readelf" -h work/libm11rawprobe.so
            "$toolbin/llvm-nm" -D --defined-only work/libm11rawprobe.so | grep 'm11_libraw_runtime_version'
            echo '--- linked dynamic libraries ---'
            "$toolbin/llvm-readelf" -d work/libm11rawprobe.so | grep NEEDED || true
          } | tee work/probe_audit.txt

          grep -q 'AArch64' work/probe_audit.txt
          grep -q 'm11_libraw_runtime_version' work/probe_audit.txt
          grep -q 'm11_libraw_runtime_version_number' work/probe_audit.txt

      - name: Upload derived link probe
        uses: actions/upload-artifact@v4
        with:
          name: M11-APK1A-LibRaw-0.22.1-arm64-probe
          path: |
            work/libm11rawprobe.so
            work/probe_audit.txt
            work/configure.log
            work/build.log
          if-no-files-found: error
          retention-days: 14
