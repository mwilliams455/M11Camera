name: R1 M11 pixel chroma probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/m11-r0-evidence-input-space
    paths:
      - 'tools/probe_m11_pixel_chroma_fast.py'
      - 'tools/probe_m11_pixel_chroma_icc.py'
      - 'tools/jpeg_icc_srgb.py'
      - '.github/workflows/r1-m11-pixel-chroma-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl libgl1
          python -m pip install --disable-pip-version-check numpy rawpy pillow opencv-python-headless

      - name: Download 12 original matched pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/m11 work/results
          base='https://img.photographyblog.com/reviews/leica_m11/sample_images'
          for n in 01 04 05 10 14 20 24 31 34 37 38 45; do
            for ext in dng jpg; do
              f="leica_m11_${n}.${ext}"
              curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 \
                "$base/$f" -o "work/m11/$f"
            done
          done

      - name: Inspect embedded JPEG ICC profiles
        run: |
          exiftool -G1 -a -s \
            -ColorSpace -ProfileDescription -ProfileCopyright -DeviceManufacturer \
            -DeviceModel -RenderingIntent work/m11/*.jpg \
            | tee work/results/jpeg_icc_metadata.txt

      - name: Run ICC-managed comparative chroma probes
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 04 05 10 14 20 24 31 34 37 38 45; do
            python tools/probe_m11_pixel_chroma_icc.py \
              "work/m11/leica_m11_${n}.dng" \
              "work/m11/leica_m11_${n}.jpg" \
              --out "work/results/leica_m11_${n}_pixel_chroma_v4.json" \
              | tee "work/results/leica_m11_${n}_stdout.txt"
          done

      - name: Summarize valid route comparisons
        run: |
          python - <<'PY'
          import glob, json, statistics
          rows=[]
          profiles={}
          for p in sorted(glob.glob('work/results/*_pixel_chroma_v4.json')):
              d=json.load(open(p))
              j=d['jpeg']
              profile=(j.get('icc_profile_description'),j.get('icc_profile_sha256'))
              profiles.setdefault(profile,0); profiles[profile]+=1
              row={
                  'file':d['dng'],'iso':d['iso'],
                  'ecc':d['alignment']['ecc'],
                  'alignment_valid':d['alignment']['valid'],
                  'icc_profile_description':j.get('icc_profile_description'),
                  'icc_converted_to_srgb':j.get('icc_converted_to_srgb'),
              }
              for route,m in d['metrics'].items():
                  row[route+'_median_abs_deg']=m['abs_median_deg']
                  row[route+'_signed_median_deg']=m['signed_median_deg']
                  row[route+'_p90_abs_deg']=m['abs_p90_deg']
              rows.append(row)
          valid=[r for r in rows if r['alignment_valid'] and 'H1_median_abs_deg' in r]
          summary={
              'schema':'m11camera.r2.pixel_chroma_invariant.icc_managed.summary.v4',
              'pair_count':len(rows),
              'valid_alignment_count':len(valid),
              'profile_counts':[{'description':k[0],'sha256':k[1],'count':v} for k,v in profiles.items()],
              'valid_route_mean_pair_median_abs_deg':{
                  route:statistics.mean(r[route+'_median_abs_deg'] for r in valid)
                  for route in ('H0','H1','DNG')
              },
              'valid_route_median_pair_median_abs_deg':{
                  route:statistics.median(r[route+'_median_abs_deg'] for r in valid)
                  for route in ('H0','H1','DNG')
              },
              'valid_route_mean_signed_median_deg':{
                  route:statistics.mean(r[route+'_signed_median_deg'] for r in valid)
                  for route in ('H0','H1','DNG')
              },
              'h1_beats_h0_count':sum(r['H1_median_abs_deg'] < r['H0_median_abs_deg'] for r in valid),
              'h1_beats_dng_count':sum(r['H1_median_abs_deg'] < r['DNG_median_abs_deg'] for r in valid),
              'pairs':rows,
          }
          open('work/results/summary_v4.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: m11-r2-pixel-chroma-probe-v4-icc
          path: work/results/
          if-no-files-found: error
          retention-days: 7
