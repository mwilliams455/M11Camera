name: R1 M11 pixel chroma probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/m11-r0-evidence-input-space
    paths:
      - 'tools/probe_m11_pixel_chroma_fast.py'
      - '.github/workflows/r1-m11-pixel-chroma-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl libgl1
          python -m pip install --disable-pip-version-check numpy rawpy pillow opencv-python-headless

      - name: Download original matched pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/m11 work/results
          base='https://img.photographyblog.com/reviews/leica_m11/sample_images'
          for n in 04 05 34 38; do
            for ext in dng jpg; do
              f="leica_m11_${n}.${ext}"
              curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 \
                "$base/$f" -o "work/m11/$f"
            done
          done

      - name: Run comparative chroma-angle probes
        shell: bash
        run: |
          set -euo pipefail
          for n in 04 05 34 38; do
            python tools/probe_m11_pixel_chroma_fast.py \
              "work/m11/leica_m11_${n}.dng" \
              "work/m11/leica_m11_${n}.jpg" \
              --out "work/results/leica_m11_${n}_pixel_chroma_v2.json" \
              | tee "work/results/leica_m11_${n}_stdout.txt"
          done

      - name: Summarize route comparison
        run: |
          python - <<'PY'
          import glob, json, statistics
          rows=[]
          for p in sorted(glob.glob('work/results/*_pixel_chroma_v2.json')):
              d=json.load(open(p))
              row={'file':d['dng'],'iso':d['iso'],'ecc':d['alignment']['ecc']}
              for route,m in d['metrics'].items():
                  row[route+'_median_abs_deg']=m['abs_median_deg']
                  row[route+'_p90_abs_deg']=m['abs_p90_deg']
                  row[route+'_valid_fraction']=m['fraction']
              rows.append(row)
          summary={
              'schema':'m11camera.r1.pixel_chroma_invariant.comparative.summary.v2',
              'count':len(rows),
              'route_mean_pair_median_abs_deg':{
                  route:statistics.mean(r[route+'_median_abs_deg'] for r in rows)
                  for route in ('H0','H1','DNG')
              },
              'pairs':rows,
          }
          open('work/results/summary_v2.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: m11-r1-pixel-chroma-probe-v2
          path: work/results/
          if-no-files-found: error
          retention-days: 7
