name: M11 APK1A rawpy Oracle Probe

on:
  workflow_dispatch:
  push:
    branches:
      - m11-apk1a
    paths:
      - 'requirements/m11_raw_oracle.txt'
      - 'tools/validate_m11_raw_oracle_environment.py'
      - '.github/workflows/m11-apk1a-rawpy-oracle-probe.yml'

permissions:
  contents: read

jobs:
  verify-python-raw-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen RAW oracle
        run: python -m pip install --disable-pip-version-check -r requirements/m11_raw_oracle.txt

      - name: Verify rawpy and runtime LibRaw identity
        run: |
          set -euo pipefail
          python tools/validate_m11_raw_oracle_environment.py | tee M11_RAW_ORACLE_IDENTITY.json

      - name: Upload RAW oracle identity
        uses: actions/upload-artifact@v4
        with:
          name: M11-APK1A-rawpy-oracle-identity
          path: M11_RAW_ORACLE_IDENTITY.json
          if-no-files-found: error
          retention-days: 14
