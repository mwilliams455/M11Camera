name: M11 COLORBACK1A APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/render1h-b2rwbplace1a-colorback1a

jobs:
  build-colorback1a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBRAW_COMMIT: b860248a89d9082b8e0a1e202e516f46af9adb29
      LIBRAW_CMAKE_COMMIT: eb98e4325aef2ce85d2eb031c2ff18640ca616d3
      NDK_VERSION: 27.2.12479018
      M11_LIBRAW_PATH: ${{ github.workspace }}/work/LibRaw
      M11_LIBRAW_CMAKE_PATH: ${{ github.workspace }}/work/LibRaw-cmake
      M11_REFERENCE_ASSET_SHA256: 54415604a45dc4ed704ebbbe6b089a946593032f464fdca0a86af6ef4be94219

    steps:
      - name: Checkout M11 repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen rawpy parity environment
        run: python -m pip install --disable-pip-version-check -r requirements/m11_raw_oracle.txt

      - name: Materialize canonical M11 asset
        run: |
          set -euo pipefail
          python -m unittest tests.test_materialize_m11_reference_tables -v
          python tools/materialize_m11_embedded_asset.py
          test "$(wc -c < app/src/main/assets/m11_reference_tables_v1.bin)" -eq 23150
          test "$(sha256sum app/src/main/assets/m11_reference_tables_v1.bin | cut -d' ' -f1)" = "$M11_REFERENCE_ASSET_SHA256"

      - name: Generate synthetic RAW diagnostic assets
        run: |
          set -euo pipefail
          python tools/validate_m11_raw_oracle_environment.py | tee M11_RAWPY_IDENTITY.json
          PYTHONPATH=. python tools/generate_m11_android_python_parity_fixture.py --out app/src/test/resources/m11_python_android_parity_v1.b64
          mkdir -p app/src/main/assets work/rawpy_selftest
          python tools/generate_m11_synthetic_dng.py --out app/src/main/assets/apk1a_synthetic.dng | tee M11_SYNTHETIC_DNG.txt
          python tools/dump_m11_rawpy_pixel_parity.py app/src/main/assets/apk1a_synthetic.dng work/rawpy_selftest | tee M11_RAWPY_SELFTEST_DUMP.txt
          cp work/rawpy_selftest/mosaic_u16le.bin app/src/main/assets/apk1a_expected_mosaic_u16le.bin
          cp work/rawpy_selftest/ahd_u16le.bin app/src/main/assets/apk1a_expected_ahd_u16le.bin

      - name: Audit COLORBACK1A isolation
        run: |
          set -euo pipefail
          grep -q 'renderStandardB2rWbPlacementFd' app/src/main/java/com/m11/diagnostic/M11RenderWorkflow.java
          grep -q 'nativeRenderRealXiaomiStandardB2rWbPlacementFd' app/src/main/java/com/m11/diagnostic/M11RenderBridge.java
          grep -q 'config.use_chroma = false' app/src/main/cpp/m11_render_colorback_jni.cpp
          grep -q 'Cat42_controlled_ablation_no_extra_saturation_gain' app/src/main/cpp/m11_render_colorback_jni.cpp
          grep -q 'm11_render_colorback_jni.cpp' app/src/main/cpp/CMakeLists.txt
          ! grep -q '^    m11_render_b2rwb_jni.cpp$' app/src/main/cpp/CMakeLists.txt
          grep -q 'com.m11.diagnostic.colorback1a' app/build.gradle.kts
          grep -q '0.1.12-render1h-b2rwbplace1a-colorback1a' app/build.gradle.kts
          grep -q 'M11 COLORBACK1A' app/src/main/AndroidManifest.xml
          ! grep -RniE 'LocalLaplacian|local_tone_mapping|hdr_merge|HDRMerge' native/m11_renderer/m11_reference_renderer_core.h app/src/main/cpp/m11_render_colorback_jni.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Fetch exact LibRaw sources
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw.git "$M11_LIBRAW_PATH"
          git -C "$M11_LIBRAW_PATH" checkout --detach "$LIBRAW_COMMIT"
          git clone --filter=blob:none https://github.com/LibRaw/LibRaw-cmake.git "$M11_LIBRAW_CMAKE_PATH"
          git -C "$M11_LIBRAW_CMAKE_PATH" checkout --detach "$LIBRAW_CMAKE_COMMIT"
          test "$(git -C "$M11_LIBRAW_PATH" rev-parse HEAD)" = "$LIBRAW_COMMIT"
          test "$(git -C "$M11_LIBRAW_CMAKE_PATH" rev-parse HEAD)" = "$LIBRAW_CMAKE_COMMIT"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests and build COLORBACK1A debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee M11_COLORBACK1A_GRADLE.log

      - name: Audit APK
        if: success()
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$apk"
          unzip -l "$apk" | tee M11_COLORBACK1A_APK_CONTENTS.log
          grep -q 'lib/arm64-v8a/libm11rawjni.so' M11_COLORBACK1A_APK_CONTENTS.log
          grep -q 'assets/m11_reference_tables_v1.bin' M11_COLORBACK1A_APK_CONTENTS.log
          unzip -p "$apk" assets/m11_reference_tables_v1.bin > M11_APK_REFERENCE_ASSET.bin
          test "$(sha256sum M11_APK_REFERENCE_ASSET.bin | cut -d' ' -f1)" = "$M11_REFERENCE_ASSET_SHA256"
          sha256sum "$apk" | tee M11_COLORBACK1A_APK_SHA256.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-COLORBACK1A-buildlog
          path: |
            M11_COLORBACK1A_GRADLE.log
            M11_COLORBACK1A_APK_CONTENTS.log
            M11_COLORBACK1A_APK_SHA256.txt
            M11_RAWPY_IDENTITY.json
            M11_SYNTHETIC_DNG.txt
            M11_RAWPY_SELFTEST_DUMP.txt
          if-no-files-found: ignore

      - name: Upload COLORBACK1A debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M11Cam-COLORBACK1A
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
